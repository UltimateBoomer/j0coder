{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-default-deny, namespace: {{ .Release.Namespace }}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-dns, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {{ toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector: {{ toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-internal-ingress, namespace: {{ .Release.Namespace }}}
spec:
  podSelector:
    matchExpressions: [{key: app.kubernetes.io/component, operator: In, values: [api, editor]}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {{ toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
          podSelector: {{ toYaml .Values.networkPolicy.ingressPodSelector | nindent 12 }}
        {{- range .Values.networkPolicy.ingressCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-editor-proxy, namespace: {{ .Release.Namespace }}}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: editor}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
      ports: [{protocol: TCP, port: 8081}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-api-editor-egress, namespace: {{ .Release.Namespace }}}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: editor}
      ports: [{protocol: TCP, port: 8081}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-destinations, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    {{- range .Values.networkPolicy.apiServerCidrs }}
    - to: [{ipBlock: {cidr: {{ . }}}}]
      ports: [{protocol: TCP, port: {{ $.Values.networkPolicy.apiServerPort }}}]
    {{- end }}
    {{- range .Values.networkPolicy.postgresCidrs }}
    - to: [{ipBlock: {cidr: {{ . }}}}]
      ports: [{protocol: TCP, port: {{ $.Values.networkPolicy.postgresPort }}}]
    {{- end }}
    {{- range .Values.networkPolicy.valkeyCidrs }}
    - to: [{ipBlock: {cidr: {{ . }}}}]
      ports: [{protocol: TCP, port: {{ $.Values.networkPolicy.valkeyPort }}}]
    {{- end }}
    {{- range .Values.networkPolicy.catalogSshCidrs }}
    - to: [{ipBlock: {cidr: {{ . }}}}]
      ports: [{protocol: TCP, port: {{ $.Values.networkPolicy.catalogSshPort }}}]
    {{- end }}
{{- end }}
