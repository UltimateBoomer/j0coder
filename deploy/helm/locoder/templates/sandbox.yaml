apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "locoder.sandboxNamespace" . }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: locoder-sandboxes, namespace: {{ include "locoder.sandboxNamespace" . }}}
spec:
  hard:
    requests.cpu: {{ .Values.sandbox.quota.cpu | quote }}
    requests.memory: {{ .Values.sandbox.quota.memory }}
    limits.cpu: {{ .Values.sandbox.quota.cpu | quote }}
    limits.memory: {{ .Values.sandbox.quota.memory }}
    requests.ephemeral-storage: {{ .Values.sandbox.quota.ephemeralStorage }}
    limits.ephemeral-storage: {{ .Values.sandbox.quota.ephemeralStorage }}
    pods: {{ .Values.sandbox.quota.pods | quote }}
---
apiVersion: v1
kind: LimitRange
metadata: {name: locoder-sandboxes, namespace: {{ include "locoder.sandboxNamespace" . }}}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
      default: {cpu: "1", memory: 1Gi, ephemeral-storage: 256Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ include "locoder.sandboxNamespace" . }}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: locoder-worker, namespace: {{ .Release.Namespace }}}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: locoder-editor, namespace: {{ .Release.Namespace }}}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: locoder-sandbox-controller, namespace: {{ include "locoder.sandboxNamespace" . }}}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/attach]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: locoder-sandbox-controller, namespace: {{ include "locoder.sandboxNamespace" . }}}
subjects:
  - {kind: ServiceAccount, name: locoder-worker, namespace: {{ .Release.Namespace }}}
  - {kind: ServiceAccount, name: locoder-editor, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: locoder-sandbox-controller}
