events { worker_connections 1024; }
http {
  # The published port is loopback-only; the host TLS proxy sanitizes XFF.
  # Preserve its chain: rootless port forwarding may translate the socket peer.
  access_log off;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=coarse:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  client_max_body_size 2m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    limit_req zone=coarse burst=40 nodelay;
    limit_req_status 429;
    limit_conn connections 30;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    location = /api/v1/session {
      limit_req_status 429;
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
    location /editor/ {
      proxy_pass http://editor:8081;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_read_timeout 360s;
    }
    location / { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; }
  }
}
