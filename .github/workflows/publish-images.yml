name: Publish container images

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: j0coder-app
            containerfile: deploy/App.Containerfile
          - image: j0coder-toolchain
            containerfile: deploy/Toolchain.Containerfile
    steps:
      - name: Check out release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set image name and release tag
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]] || ((${#RELEASE_TAG} > 128)); then
            echo "Release tag is not a valid container tag: $RELEASE_TAG" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          printf 'name=%s\ntag=%s\n' "$image" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.containerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true

      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### %s\n\nTag: `%s:%s`  \nDigest: `%s@%s`\n' \
            '${{ matrix.image }}' "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Save immutable image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s' "$IMAGE" "$DIGEST" > image-reference.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-reference
          path: image-reference.txt

  deployment:
    name: Publish complete installation release
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: references
      - name: Build patched gVisor archive
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap
          ./scripts/install-gvisor-dev.sh
      - name: Assemble release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/package-release.py --version "$RELEASE_TAG" \
            --app-image "$(cat references/j0coder-app-reference/image-reference.txt)" \
            --toolchain-image "$(cat references/j0coder-toolchain-reference/image-reference.txt)" \
            --gvisor-dir .dev/gvisor/current
      - name: Verify anonymous image pulls
        run: |
          mkdir -p /tmp/j0coder-empty-auth
          printf '{"auths":{}}' > /tmp/j0coder-empty-auth/auth.json
          for ref in references/*/image-reference.txt; do
            podman pull --authfile /tmp/j0coder-empty-auth/auth.json "$(cat "$ref")"
          done
      - name: Publish archives first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx release-manifest.json; then
            echo 'Refusing to replace artifacts of an already complete release' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release-assets/deployment.tar.gz release-assets/gvisor-linux-x86_64.tar.gz --clobber
      - name: Verify anonymous archive downloads
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PYCODE'
          import json, urllib.request, hashlib
          manifest = json.load(open('release-assets/release-manifest.json'))
          for key in ('bundle', 'gvisor'):
              asset = manifest[key]
              with urllib.request.urlopen(asset['url'], timeout=120) as response:
                  assert hashlib.sha256(response.read()).hexdigest() == asset['sha256']
          PYCODE
      - name: Publish completion manifest last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/release-manifest.json --clobber
